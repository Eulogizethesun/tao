# bot-metric policy override (upstream-fork exemption, user ruling 2026-10).
#
# Why: this is a downstream OHOS fork carrying upstream Tauri's historical
# complexity debt wholesale. The default bot-metric policy blocks on
# warning-severity findings (cyclomatic complexity, function length, ...),
# which would flag hundreds of upstream baseline items that this fork does
# not own and must not churn-rewrite (every cosmetic refactor of upstream
# code is a future merge conflict against upstream).
#
# Effect: only `error`-severity findings block the metric gate. Warning-level
# findings are still reported in full in .botgate/metric.json / report.md —
# nothing is suppressed from visibility, they simply stop being blocking.
# Quality targets mirror BotGate's own generated default policy (which the
# built-in defaults alone would fail on this codebase's duplication and
# unsafe-density baseline): average-file-lines ceiling raised to 600 and the
# unsafe-density / code-size-growth targets disabled.
# `analysis.cfg_policy = "active"` scopes the static analysis to code that is
# cfg-active for the analyzing host, so macOS-gated code is not analyzed as
# if it were active on this host. Note the division of labor with the
# in-tree fix f69ab048: the semantically-null `#[path = "async.rs"]` on
# `mod r#async;` (platform_impl/macos) carries the analyzer's file discovery
# (BM102), while cfg_policy carries cfg scoping.
#
# Restore condition: revisit once the upstream baseline debt is paid down
# (or the fork rebases onto an upstream that clears it) — remove the
# `blocking_severities` override and the quality-target section to return to
# the default policy.

[rules]
blocking_severities = ["error"]

[quality_targets]
max_average_file_lines = 600
disabled_targets = ["max_unsafe_density", "max_code_size_growth_ratio"]

[analysis]
cfg_policy = "active"
